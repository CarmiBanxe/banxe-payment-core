[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banxe-payment-core"
version = "0.1.0"
description = "BANXE payment processing stack — Hyperswitch + Paymentology + Midaz (ADR-015)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "bandit[toml]>=1.7",
    "semgrep>=1.75",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# Contract-only port interfaces are pure ABCs (abstractmethod bodies are
# docstrings/...) with no executable logic, so they are intentionally untested
# and must not drag down total coverage. Exclude the port contracts and their
# thin re-export packages; real adapters/implementations stay measured.
omit = [
    "src/*/*_port.py",
    "src/wallet/__init__.py",
    "src/partner/__init__.py",
    "src/exchangeport/__init__.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.bandit]
skips = ["B101"]  # assert in tests
targets = ["src"]
